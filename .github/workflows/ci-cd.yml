name: CI / Deploy

# Every push and pull request is tested. A green push to main is built into an image,
# pushed to GHCR and deployed to the VPS. Each job depends on the previous one, so a
# failing suite cannot produce an image and a failed build cannot be deployed.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  # One deployment at a time: two overlapping SSH deploys would fight over the same
  # compose project.
  group: backend-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/e-voting-system-backend

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      # A real MongoDB: the unique indexes, the TTL behaviour and the duplicate-
      # registration constraint are part of what is being tested.
      mongodb:
        image: mongo:7
        ports: ['27017:27017']
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ping:1}).ok'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: yarn

      - name: Enable Corepack
        run: corepack enable

      - name: Install
        run: yarn install --immutable

      - name: Typecheck
        run: yarn typecheck

      - name: Lint
        run: yarn lint

      - name: Test
        # The chain is a scripted stand-in here (tests/helpers/fakeChain.ts); the real
        # contract is exercised by `yarn e2e` against a live node.
        run: yarn test

      - name: Check the contract ABI has not drifted
        # Optional: needs read access to the contracts repository. Set CONTRACTS_REPO_TOKEN
        # to enable it, otherwise the step is skipped rather than failing a build that has
        # nothing wrong with it.
        #
        # Read through `env` rather than tested directly in `if`: the secrets context is
        # not dependable in a step condition, and would silently evaluate to false.
        env:
          CONTRACTS_REPO_TOKEN: ${{ secrets.CONTRACTS_REPO_TOKEN }}
        if: env.CONTRACTS_REPO_TOKEN != ''
        run: |
          git clone --depth 1 \
            "https://x-access-token:${CONTRACTS_REPO_TOKEN}@github.com/${{ github.repository_owner }}/e-voting-system-smart-contracts.git" \
            ../e-voting-system-smart-contracts
          yarn sync:contracts --check

  build:
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v3

      - name: Sign in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          # Provided automatically; no personal token needed to push.
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          # Tagged by commit SHA so a deployment is immutable and a rollback is just the
          # previous tag. `latest` is a convenience for manual pulls, never for deploys.
          tags: |
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ env.IMAGE_NAME }}:latest
          # Layer cache in GitHub Actions: without it every build reinstalls the whole
          # dependency tree, native modules included.
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build
    runs-on: ubuntu-latest
    # A GitHub environment holds the server secrets and can require a reviewer.
    environment: production
    permissions:
      contents: read
      # Lets the server pull the private image with this run's own short-lived token.
      packages: read

    # Everything the server needs comes from here; nothing is configured on it by hand.
    # Each setting is read from a variable or a secret of that name (Settings → Environments
    # → production), falling back to the default shown.
    #
    #   Required secrets: DEPLOY_HOST, DEPLOY_USER, DEPLOY_PASSWORD,
    #                     BLOCKCHAIN_RPC_URL, BACKEND_PRIVATE_KEY
    #   Optional:         API_DOMAIN, CORS_ORIGIN, CERTBOT_EMAIL, APP_PORT, DEPLOY_PATH,
    #                     CONTRACT_ADDRESS, BLOCKCHAIN_START_BLOCK, TRUSTEE_ADDRESSES
    env:
      DEPLOY_PATH: ${{ vars.DEPLOY_PATH || secrets.DEPLOY_PATH || 'e-voting-backend' }}

    steps:
      - uses: actions/checkout@v5

      - name: Resolve the API domain
        id: domain
        env:
          API_DOMAIN: ${{ vars.API_DOMAIN || secrets.API_DOMAIN }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        # Without a domain of its own the server gets one from sslip.io, which resolves
        # api.1-2-3-4.sslip.io to 1.2.3.4 with no DNS setup — enough for a certificate.
        run: |
          if [ -z "$DEPLOY_HOST" ]; then
            echo "::error::Set the DEPLOY_HOST secret (the server's IP address)."; exit 1
          fi
          if [ -z "$API_DOMAIN" ]; then
            if [[ "$DEPLOY_HOST" =~ ^[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              API_DOMAIN="api.${DEPLOY_HOST//./-}.sslip.io"
            else
              API_DOMAIN="$DEPLOY_HOST"
            fi
          fi
          echo "name=$API_DOMAIN" >> "$GITHUB_OUTPUT"
          echo "API will be served at https://$API_DOMAIN/api" >> "$GITHUB_STEP_SUMMARY"

      - name: Copy the compose file and server scripts
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          password: ${{ secrets.DEPLOY_PASSWORD }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          source: 'docker-compose.yml,scripts/deploy-docker.sh,scripts/provision.sh'
          target: ${{ env.DEPLOY_PATH }}

      - name: Provision and deploy
        uses: appleboy/ssh-action@v1.2.0
        env:
          IMAGE_TAG: ${{ github.sha }}
          BACKEND_IMAGE: ${{ env.IMAGE_NAME }}
          GHCR_USER: ${{ github.actor }}
          GHCR_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
          API_DOMAIN: ${{ steps.domain.outputs.name }}
          CORS_ORIGIN: ${{ vars.CORS_ORIGIN || secrets.CORS_ORIGIN }}
          CERTBOT_EMAIL: ${{ vars.CERTBOT_EMAIL || secrets.CERTBOT_EMAIL }}
          APP_PORT: ${{ vars.APP_PORT || secrets.APP_PORT || '5000' }}
          BLOCKCHAIN_RPC_URL: ${{ secrets.BLOCKCHAIN_RPC_URL }}
          BACKEND_PRIVATE_KEY: ${{ secrets.BACKEND_PRIVATE_KEY }}
          CONTRACT_ADDRESS: ${{ vars.CONTRACT_ADDRESS || secrets.CONTRACT_ADDRESS || '0xF4A6d7C105021b40fa9A9DBA7e9e477D3dc83bE4' }}
          BLOCKCHAIN_START_BLOCK: ${{ vars.BLOCKCHAIN_START_BLOCK || secrets.BLOCKCHAIN_START_BLOCK || '11939503' }}
          TRUSTEE_ADDRESSES: ${{ vars.TRUSTEE_ADDRESSES || secrets.TRUSTEE_ADDRESSES }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          password: ${{ secrets.DEPLOY_PASSWORD }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          command_timeout: 20m
          envs: IMAGE_TAG,BACKEND_IMAGE,GHCR_USER,GHCR_PASSWORD,API_DOMAIN,CORS_ORIGIN,CERTBOT_EMAIL,APP_PORT,BLOCKCHAIN_RPC_URL,BACKEND_PRIVATE_KEY,CONTRACT_ADDRESS,BLOCKCHAIN_START_BLOCK,TRUSTEE_ADDRESSES
          script: |
            set -euo pipefail
            cd "${{ env.DEPLOY_PATH }}"
            mv -f scripts/deploy-docker.sh scripts/provision.sh . && rmdir scripts 2>/dev/null || true
            bash provision.sh
            bash deploy-docker.sh "$IMAGE_TAG"

      - name: Verify the service is answering from outside
        # A container reporting healthy internally can still be unreachable through nginx.
        env:
          HEALTH_URL: https://${{ steps.domain.outputs.name }}/api/health
        run: |
          for attempt in $(seq 1 10); do
            if curl -fsS --max-time 10 "$HEALTH_URL" | grep -q '"success":true'; then
              echo "Health check passed: $HEALTH_URL"
              exit 0
            fi
            echo "Attempt $attempt failed; retrying in 5s"
            sleep 5
          done
          echo "::error::$HEALTH_URL did not answer. If the deploy log shows a certificate warning, check DNS for the domain."
          exit 1
