name: CI / Deploy

# Every push and pull request is tested. A green push to main is built into an image,
# pushed to GHCR and deployed to the VPS. Each job depends on the previous one, so a
# failing suite cannot produce an image and a failed build cannot be deployed.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  # One deployment at a time: two overlapping SSH deploys would fight over the same
  # compose project.
  group: backend-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/e-voting-system-backend

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      # A real MongoDB: the unique indexes, the TTL behaviour and the duplicate-
      # registration constraint are part of what is being tested.
      mongodb:
        image: mongo:7
        ports: ['27017:27017']
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ping:1}).ok'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn

      - name: Enable Corepack
        run: corepack enable

      - name: Install
        run: yarn install --immutable

      - name: Typecheck
        run: yarn typecheck

      - name: Lint
        run: yarn lint

      - name: Test
        # The chain is a scripted stand-in here (tests/helpers/fakeChain.ts); the real
        # contract is exercised by `yarn e2e` against a live node.
        run: yarn test

      - name: Check the contract ABI has not drifted
        # Optional: needs read access to the contracts repository. Set CONTRACTS_REPO_TOKEN
        # to enable it, otherwise the step is skipped rather than failing a build that has
        # nothing wrong with it.
        #
        # Read through `env` rather than tested directly in `if`: the secrets context is
        # not dependable in a step condition, and would silently evaluate to false.
        env:
          CONTRACTS_REPO_TOKEN: ${{ secrets.CONTRACTS_REPO_TOKEN }}
        if: env.CONTRACTS_REPO_TOKEN != ''
        run: |
          git clone --depth 1 \
            "https://x-access-token:${CONTRACTS_REPO_TOKEN}@github.com/${{ github.repository_owner }}/e-voting-system-smart-contracts.git" \
            ../e-voting-system-smart-contracts
          yarn sync:contracts --check

  build:
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Sign in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          # Provided automatically; no personal token needed to push.
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          # Tagged by commit SHA so a deployment is immutable and a rollback is just the
          # previous tag. `latest` is a convenience for manual pulls, never for deploys.
          tags: |
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ env.IMAGE_NAME }}:latest
          # Layer cache in GitHub Actions: without it every build reinstalls the whole
          # dependency tree, native modules included.
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build
    runs-on: ubuntu-latest
    # A GitHub environment holds the server secrets and can require a reviewer.
    environment: production

    steps:
      - uses: actions/checkout@v4

      - name: Copy the compose file and deploy script to the server
        # The server needs no source checkout — only the compose definition, the deploy
        # script and its own .env.
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          source: 'docker-compose.yml,scripts/deploy-docker.sh'
          target: ${{ secrets.DEPLOY_PATH }}
          strip_components: 0

      - name: Deploy
        uses: appleboy/ssh-action@v1.2.0
        env:
          IMAGE_TAG: ${{ github.sha }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          envs: IMAGE_TAG
          script: |
            set -euo pipefail
            cd "${{ secrets.DEPLOY_PATH }}"

            # Only needed while the GHCR package is private. Leave GHCR_TOKEN unset once
            # the package is public and this is skipped.
            if [ -n "${{ secrets.GHCR_TOKEN }}" ]; then
              echo "${{ secrets.GHCR_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
            fi

            # Which image this server pulls, recorded once so the compose file stays generic.
            grep -q '^BACKEND_IMAGE=' .env 2>/dev/null || \
              echo "BACKEND_IMAGE=ghcr.io/${{ github.repository_owner }}/e-voting-system-backend" >> .env

            mv -f scripts/deploy-docker.sh ./deploy-docker.sh 2>/dev/null || true
            rmdir scripts 2>/dev/null || true
            chmod +x deploy-docker.sh

            bash deploy-docker.sh "$IMAGE_TAG"

      - name: Verify the service is answering from outside
        # A container reporting healthy internally can still be unreachable through nginx.
        run: |
          for attempt in $(seq 1 10); do
            if curl -fsS --max-time 10 "${{ secrets.HEALTH_CHECK_URL }}" | grep -q '"success":true'; then
              echo "Health check passed"
              exit 0
            fi
            echo "Attempt $attempt failed; retrying in 5s"
            sleep 5
          done
          echo "::error::The deployed backend did not pass its health check"
          exit 1
